[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-text-extractor"
version = "0.1.0"
description = "图片/PDF 文本提取库：可选文本 + Tesseract OCR 混合解析，LiteParse 可选增强"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "PyPDF2>=3.0.0",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "Pillow>=10.2.0",
]

[project.optional-dependencies]
liteparse = ["liteparse"]
dev = ["pytest"]

[project.scripts]
doc-text-extractor = "doc_text_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["doc_text_extractor*"]
